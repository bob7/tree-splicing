<!doctype html>
<html lang="en" data-theme="dark">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tree Builder</title>
  <style>

  </style>
</head>
<body>

        <button id="svgButton" class="action-button" type="button" aria-label="Save tree area as SVG and HTML with inline SVG">svg</button>
        <button id="gifButton" class="action-button" type="button" aria-label="Create animated GIF and SVG files of all additions since Reset" disabled>gif</button>
      </div>
      <label class="theme-switch" for="themeToggle" title="Switch tree areas to light mode">
        <input id="themeToggle" type="checkbox" role="switch" checked aria-label="Dark tree areas">
        <span class="theme-icon" aria-hidden="true">
          <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none"><path d="M9.3812 2.04327C7.76937 2.50154 6.2485 3.36519 4.97948 4.63421C1.00684 8.60687 1.00684 15.0478 4.97948 19.0205C8.95213 22.9932 15.3931 22.9932 19.3657 19.0205C20.6429 17.7433 21.5095 16.211 21.9654 14.5876M9.5384 2C8.6321 5.39377 9.51018 9.16492 12.1726 11.8274C14.8351 14.4899 18.6063 15.368 22 14.4617" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
          <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none"><path d="M17.5 17.5L19 19M20 12H22M6.5 6.5L5 5M17.5 6.5L19 5M6.5 17.5L5 19M2 12H4M12 2V4M12 20V22M16 12C16 14.2091 14.2091 16 12 16C9.79086 16 8 14.2091 8 12C8 9.79086 9.79086 8 12 8C14.2091 8 16 9.79086 16 12Z" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </span>
      </label>
    </section>
    <section class="tree-stage" aria-label="Tree construction area">
      <article class="tree-panel tree-panel--active">
        <div class="panel-heading"><div><span class="tree-badge tree-badge--left">L</span><h2>L-tree</h2></div></div>
        <div id="leftTreeArea" class="tree-area tree-area--interactive" role="application" tabindex="0" aria-label="Left tree. Click an empty point above the root to add a node.">
          <svg id="leftTreeSvg" aria-hidden="true"></svg>
          <div class="click-hint" aria-hidden="true"><span>+</span>click anywhere above the root</div>
        </div>
      </article>
      <div class="stage-divider" aria-hidden="true"><span></span><b>×</b><span></span></div>
      <article class="tree-panel tree-panel--waiting">
        <div class="panel-heading"><div><span class="tree-badge tree-badge--right">R</span><h2>R-tree</h2></div><div class="counter-actions"><button id="spliceGifButton" class="splice-button" type="button" aria-label="Create animated GIF and SVG files of the splice and split transition">gif</button><button id="spliceButton" class="splice-button" type="button" aria-label="Splice R-node groups into their L-node positions">splice</button></div></div>
        <div id="rightTreeArea" class="tree-area" aria-label="Right tree generated from the left tree.">
          <svg id="rightTreeSvg" aria-hidden="true"></svg>
        </div>
      </article>
    </section>
    <p id="exportDownloads" class="export-downloads" hidden>Latest SVG export — download files:<a id="exportSvgLink" download="tree-builder.svg">SVG</a><a id="exportHtmlLink" download="tree-builder.html">HTML</a></p>
    <section class="width-panel" aria-label="Tree i-width plots">
      <button id="widthToggle" class="width-toggle" type="button" aria-expanded="false" aria-controls="widthContent"><span>width growth</span><span aria-hidden="true">⌄</span></button>
      <div id="widthContent" class="width-content" hidden>
        <article class="width-chart"><svg id="widthPlot" aria-label="Comparison of L-tree and R-tree i-width"></svg></article>
      </div>
    </section>
  </main>
  <div id="liveRegion" class="sr-only" aria-live="polite"></div>
  <script>

    let gridDivisions=INITIAL_GRID_DIVISIONS,leftNodes=[],rightNodes=[],nextNodeId=1,nextRightNodeId=1,w=0,resizeFrame=null,autoTimer=null,recordedFrames=[],stageHistory=[],stageIndex=0,gifRendering=false,rightSpliced=false,spliceFrame=null,spliceCaptureActive=false,hoveredLeftNodeId=null,hoveredRightNodeId=null;
